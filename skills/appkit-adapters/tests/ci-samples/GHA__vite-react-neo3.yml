# GHA__vite-react-neo3.yml
# Sample (non-binding) GitHub Actions workflow for validating the skill examples
# (vite-react-neo3 and simple-app). Copy into .github/workflows/ of the appkit-adapters repo.
#
# The examples link the adapters via `file:../../../../packages/<name>`, so the Rush
# packages must be installed and built before installing the example.

name: skill-examples

on:
  push:
    paths:
      - 'skills/appkit-adapters/**'
      - 'packages/**'
  pull_request:
    paths:
      - 'skills/appkit-adapters/**'
      - 'packages/**'

jobs:
  install-and-build-example:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        example: [vite-react-neo3, simple-app]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm must be on PATH before setup-node can use `cache: 'pnpm'`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # matches packageManager pnpm@9.15.9 in the examples
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: skills/appkit-adapters/examples/${{ matrix.example }}/pnpm-lock.yaml

      - name: Rush install
        run: node common/scripts/install-run-rush.js install

      - name: Build adapter packages
        run: node common/scripts/install-run-rush.js build-packages

      - name: Install + build (${{ matrix.example }})
        working-directory: skills/appkit-adapters/examples/${{ matrix.example }}
        run: |
          pnpm -v
          node -v
          pnpm install --frozen-lockfile
          pnpm build

      # Optional: vite-react-neo3 defines a `lint` script.
      # - name: Lint
      #   if: matrix.example == 'vite-react-neo3'
      #   working-directory: skills/appkit-adapters/examples/${{ matrix.example }}
      #   run: pnpm lint