name: Deploy Connect Lab to GitHub Pages

on: workflow_dispatch

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Rush Install
        run: node common/scripts/install-run-rush.js install

      - name: Rush rebuild
        run: node common/scripts/install-run-rush.js rebuild --verbose

      - name: Install Connect Lab dependencies
        working-directory: apps/connect-lab
        run: pnpm install --frozen-lockfile

      - name: Build Connect Lab for GitHub Pages
        working-directory: apps/connect-lab
        run: pnpm run build
        env:
          VITE_PROJECT_ID: ${{ secrets.VITE_PROJECT_ID }}

      - name: Copy 404.html for GitHub Pages SPA routing
        run: cp apps/connect-lab/dist/index.html apps/connect-lab/dist/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./apps/connect-lab/dist

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
